name: Build Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Install iOS SDK
        run: |
          export THEOS=$HOME/theos
          mkdir -p $THEOS/sdks
          curl -L -o /tmp/sdk.zip "https://github.com/CRKokoria/theos-sdk/raw/main/iPhoneOS14.5.sdk.zip"
          unzip -q /tmp/sdk.zip -d $THEOS/sdks/
          ls -la $THEOS/sdks/

      - name: Build
        run: |
          export THEOS=$HOME/theos
          cd $GITHUB_WORKSPACE
          make package FINAL=theos
          ls -la packages/
          ls -la .theos/obj/

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: WeiJieTuVipUnlock
          path: |
            packages/*.deb
            .theos/obj/*.dylib