name: Build Tweak dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Theos
        run: |
          export THEOS=/opt/theos
          sudo git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH
          
      - name: Install iOS SDK
        run: |
          export THEOS=/opt/theos
          # 下载iOS SDK
          git clone --depth 1 https://github.com/CRKokoria/theos-sdk.git /tmp/theos-sdk
          sudo mkdir -p $THEOS/sdks
          sudo cp -r /tmp/theos-sdk/iPhoneOS*.sdk $THEOS/sdks/ || true
          ls $THEOS/sdks/
          
      - name: Build Tweak
        run: |
          export THEOS=/opt/theos
          cd $GITHUB_WORKSPACE
          make package FINAL=theos
          
      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeiJieTuVipUnlock-dylib
          path: |
            packages/*.deb
            .theos/obj/*.dylib
          retention-days: 7
