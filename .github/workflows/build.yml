name: Build Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Install ldid
        run: |
          brew install ldid

      - name: Link iOS SDK from Xcode
        run: |
          export THEOS=$HOME/theos
          mkdir -p $THEOS/sdks
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK path: $SDK_PATH"
          ln -s "$SDK_PATH" "$THEOS/sdks/iPhoneOS.sdk"
          ls -la $THEOS/sdks/

      - name: Build
        run: |
          export THEOS=$HOME/theos
          cd $GITHUB_WORKSPACE
          make package FINAL=theos
          ls -la packages/
          ls -la .theos/obj/

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: WeiJieTuVipUnlock
          path: |
            packages/*.deb
            .theos/obj/*.dylib